[project]
name = "flight-booking-agent"
version = "1.0.0"
description = "BTVN#3 - Dựng Agent đặt vé máy bay bằng LangChain & LangGraph (SE373.R11)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3",
    "langgraph>=1.2.13",
    "langchain-core>=1.6.6",
    "pydantic>=2.7.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
